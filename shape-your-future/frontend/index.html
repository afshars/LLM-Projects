<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Shape Your Future — آینده‌ات را بساز. A focused daily AI coach built around one priority, fewer distractions and an evening reflection." />
    <meta name="theme-color" content="#0b1020" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='6' y1='6' x2='42' y2='42' gradientUnits='userSpaceOnUse'%3E%3Cstop stop-color='%2322d3ee'/%3E%3Cstop offset='1' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M24 4c1.4 11 6 15.600 18 20-12 4.400-16.600 9-18 20-1.400-11-6-15.600-18-20 12-4.400 16.600-9 18-20Z' fill='url(%23g)'/%3E%3C/svg%3E" />
    <title>آینده‌ات را بساز</title>
    <!-- Apply the stored theme/language before first paint so a returning EN/light user never
         sees the hard-coded fa/rtl/dark defaults flash. Keys and dir mapping mirror
         src/lib/theme-i18n.ts + src/lib/locales.ts. -->
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var lang = localStorage.getItem("maketime:lang");
          var theme = localStorage.getItem("maketime:theme");
          if (lang === "fa" || lang === "en") {
            root.setAttribute("lang", lang);
            root.setAttribute("dir", lang === "fa" ? "rtl" : "ltr");
          }
          if (theme === "dark" || theme === "light") root.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
